name: RAS notice email alerts

on:
  # Triggered by an external scheduler (for example cron-job.org) via the
  # workflow_dispatch API; only users with write access can start it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ras-notice-monitor
  cancel-in-progress: false

jobs:
  check-notices:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright's apt step was slow.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The runner image already has Chrome's system libraries, so the slow
      # apt step (--with-deps) is skipped. Headless runs need only the shell.
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install --only-shell chromium

      - name: Restore encrypted baselines
        uses: actions/cache/restore@v4
        with:
          path: state/users
          key: ras-user-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ras-user-state-

      - name: Check RAS and send email alerts
        run: npm run monitor:cloud
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RAS_STATE_KEY: ${{ secrets.RAS_STATE_KEY }}
          RAS_RC_ID: ${{ vars.RAS_RC_ID }}
          # One block per person. Secrets are listed by name on purpose: handing
          # the whole secrets object to the script makes GitHub hold the run
          # for approval. To add a person, copy a block and change the id.
          RAS_USERS_ARPAN: ${{ vars.RAS_USERS_ARPAN }}
          RAS_EMAIL_ARPAN: ${{ secrets.RAS_EMAIL_ARPAN }}
          RAS_PASSWORD_ARPAN: ${{ secrets.RAS_PASSWORD_ARPAN }}
          RAS_USERS_SHYAM: ${{ vars.RAS_USERS_SHYAM }}
          RAS_EMAIL_SHYAM: ${{ secrets.RAS_EMAIL_SHYAM }}
          RAS_PASSWORD_SHYAM: ${{ secrets.RAS_PASSWORD_SHYAM }}

      # Saved even when one user's check fails, so users that succeeded are not
      # emailed the same items again on the next run.
      - name: Save encrypted baselines
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/users
          key: ras-user-state-${{ github.run_id }}-${{ github.run_attempt }}
